name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@v6
        with:
          path: bin/tools
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Check (swag, tidy, fmt, vet, lint, test)
        run: make check

      - name: Ensure generated and formatted files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after 'make check'. Run 'make check' locally and commit the changes."
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Build
        run: make build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: make docker-build

      - name: Smoke test
        run: |
          docker run -d --name api -p 8080:8080 ggl-task-api:local
          trap 'docker logs api; docker rm -f api' EXIT
          # --retry-all-errors also retries connection resets while the container starts
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8080/healthz
          curl -fsS -X POST http://localhost:8080/tasks \
            -H 'Content-Type: application/json' -d '{"name":"smoke"}'
          curl -fsS http://localhost:8080/tasks | grep -q '"name":"smoke"'
