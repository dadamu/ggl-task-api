version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - revive
    - testifylint
    - unconvert
    - unparam
  exclusions:
    paths:
      - swagger

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dadamu/ggl-task-api
  exclusions:
    paths:
      - swagger
